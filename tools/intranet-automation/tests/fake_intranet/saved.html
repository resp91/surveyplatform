<!doctype html>
<meta charset="utf-8">
<title>가짜 인트라넷 - 등록 내역</title>
<div id="gnb">전체 메뉴</div>
<h1>등록 내역</h1>
<ul id="records"></ul>
<script>
  const saved = JSON.parse(localStorage.getItem('records') || '[]');
  document.getElementById('records').innerHTML = saved
    .map((r) => `<li>${r.partner} / ${r.amount} / ${r.dept} / ${r.note}</li>`)
    .join('');
</script>
